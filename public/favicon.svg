<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0f0f0f" stroke="#6366f1" stroke-width="2"/>
  <!-- Clipboard body -->
  <rect x="17" y="16" width="30" height="36" rx="3" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5"/>
  <!-- Clipboard top clip -->
  <rect x="26" y="12" width="12" height="7" rx="2" fill="#4f46e5"/>
  <!-- Check lines -->
  <line x1="22" y1="27" x2="42" y2="27" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="22" y1="33" x2="38" y2="33" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="22" y1="39" x2="34" y2="39" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Green check mark -->
  <circle cx="43" cy="43" r="9" fill="#10b981"/>
  <polyline points="38.5,43 41.5,46.5 48,39.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
